name: Verificar

on:
  pull_request:
  workflow_dispatch:

jobs:
  site:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build

  funcao-nfe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Certificado A1 de teste (autoassinado)
        run: |
          openssl req -x509 -newkey rsa:2048 -nodes -days 30 -keyout key.pem -out cert.pem \
            -subj "/C=BR/O=ICP-Brasil/CN=EMPRESA TESTE LTDA:12345678000199"
          openssl pkcs12 -export -inkey key.pem -in cert.pem -out teste.pfx -passout pass:senha123
      - name: Checar tipos
        run: |
          deno check --config supabase/functions/nfe/deno.json supabase/functions/nfe/index.ts > out.log 2>&1 && exit 0
          cat out.log
          echo "::error title=deno check::$(sed 's/\x1b\[[0-9;]*m//g' out.log | head -80 | sed ':a;N;$!ba;s/\n/%0A/g')"
          exit 1
      - name: Testes
        if: always()
        env:
          TEST_PFX: teste.pfx
          TEST_PFX_PASSWORD: senha123
        run: |
          deno test --config supabase/functions/nfe/deno.json --allow-read --allow-env supabase/functions/nfe/ > out.log 2>&1 && exit 0
          cat out.log
          echo "::error title=deno test::$(sed 's/\x1b\[[0-9;]*m//g' out.log | tail -80 | sed ':a;N;$!ba;s/\n/%0A/g')"
          exit 1
