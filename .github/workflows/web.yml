name: Site

on:
  push:
    branches: [main, master, claude/onion-cost-app-clone-qdy4s1]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: site
  cancel-in-progress: true

jobs:
  publicar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Testar conexão com o banco
        run: |
          URL=$(grep -oP "SUPABASE_URL = '\K[^']+" src/lib/config.ts)
          KEY=$(grep -oP "SUPABASE_ANON_KEY = '\K[^']+" src/lib/config.ts)
          if [ -z "$URL" ]; then echo "Supabase não configurado"; exit 0; fi
          CODE=$(curl -s -o resposta.txt -w '%{http_code}' "$URL/rest/v1/settings?select=id" -H "apikey: $KEY")
          echo "HTTP $CODE"; cat resposta.txt; echo
          test "$CODE" = "200"

      - name: Build do site
        run: |
          npm ci
          npm run build

      - name: Publicar no GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          force_orphan: true
