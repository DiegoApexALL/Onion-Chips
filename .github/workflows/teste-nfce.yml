name: Teste NFC-e SP (temporário)
on:
  push:
    branches: [claude/teste-nfce-wsdl]
jobs:
  xsd:
    runs-on: ubuntu-latest
    steps:
      - name: XSD
        run: |
          curl -sL -o x.zip "https://portal.fazenda.sp.gov.br/servicos/nfce/Documents/xsd_nfceListagemChaves_nfceDownloadXML.zip" || curl -skL -o x.zip "https://portal.fazenda.sp.gov.br/servicos/nfce/Documents/xsd_nfceListagemChaves_nfceDownloadXML.zip"
          mkdir x && unzip -qo x.zip -d x; echo "::notice title=arquivos::$(find x -type f | tr '\n' ' ')"
          for f in $(find x -type f -name '*.xsd' | grep -iv -E 'xmldsig|tiposBasico|leiaute|nfe_v'); do
            python3 - "$f" <<'PY'
          import sys,re
          f=sys.argv[1]; t=open(f,encoding='utf-8',errors='replace').read()
          t=re.sub(r'<xs:annotation>.*?</xs:annotation>','',t,flags=re.S)
          t=re.sub(r'\s+',' ',t)
          print(f"::notice title={f.split('/')[-1]}::"+t.replace('%','%25')[:3500])
          PY
          done
